services:
  - type: web
    name: electrohub-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --log-level info --access-logfile - --error-logfile - --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://buxinstore.github.io/store
      - key: MODEM_PUBLIC_KEY
        sync: false
      - key: MODEM_TEST_SECRET
        sync: false
      - key: MODEM_TEST_WEBHOOK_SECRET
        sync: false
      - key: MODEM_LIVE_SECRET
        sync: false
      - key: MODEM_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_CURRENCY
        value: USD
      - key: PAYPAL_SANDBOX_CLIENT_ID
        sync: false
      - key: PAYPAL_SANDBOX_SECRET
        sync: false
      - key: PAYPAL_LIVE_CLIENT_ID
        sync: false
      - key: PAYPAL_LIVE_SECRET
        sync: false
      - key: ENABLE_LIVE_PAYMENTS
        value: "false"
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.7
      - key: SHIPPING_ESTIMATE_MAX_DESTINATIONS_PER_RUN
        value: "10"
      - key: SHIPPING_ESTIMATE_MAX_AGE_DAYS
        value: "30"
      - key: SHIPPING_MAX_DESTINATIONS_PER_UTC_DAY
        value: "10"
  - type: cron
    name: electrohub-shipping-refresh
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python shipping_refresh.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.7
      - key: SHIPPING_ESTIMATE_MAX_DESTINATIONS_PER_RUN
        value: "10"
      - key: SHIPPING_ESTIMATE_MAX_AGE_DAYS
        value: "30"
      - key: SHIPPING_MAX_DESTINATIONS_PER_UTC_DAY
        value: "10"
